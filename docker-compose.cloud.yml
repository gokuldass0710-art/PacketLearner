services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      APP_ENV: production
      ENABLE_LOCAL_CAPTURE: "false"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact frontend origin}
      TSHARK_PATH: /usr/bin/tshark
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-30}
      DEFAULT_PACKET_LIMIT: ${DEFAULT_PACKET_LIMIT:-1000}
      MAX_PACKET_LIMIT: ${MAX_PACKET_LIMIT:-5000}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL to the public backend URL}
    ports:
      - "8080:80"
    depends_on:
      - backend
